<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Алерт Зграї — шатаут</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@1,800&display=swap" rel="stylesheet">
<style>
html,body{margin:0;height:100%;background:transparent;overflow:hidden}
.stage{position:fixed;inset:0;overflow:hidden;container-type:size}
.plate{position:absolute;left:5cqw;top:-3.5cqw;width:90cqw;transform:translateY(-140%)}
.sway{transform-origin:50% 0}
.art{position:relative;aspect-ratio:2172/724;container-type:inline-size}
.bg{display:block;width:100%;height:100%;filter:drop-shadow(0 0 1cqw rgba(138,43,226,.6)) drop-shadow(0 0 2.4cqw rgba(0,85,255,.4))}
.back{position:absolute;left:9.02%;top:34.81%;width:13.44%;aspect-ratio:1;border-radius:50%;background:#07042a}
.av{position:absolute;left:9.25%;top:35.5%;width:12.98%;aspect-ratio:1;border-radius:50%;overflow:hidden;display:grid;place-items:center;background:linear-gradient(145deg,#8a3dff,#2b5bff);opacity:0}
.av b{font:800 italic 7cqw/1 Montserrat,sans-serif;color:#fff}
.av img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.nickbox{position:absolute;left:28.54%;top:37.3%;width:42.36%;height:22.1%;display:flex;align-items:center;justify-content:center}
.nick{display:inline-block;white-space:nowrap;opacity:0;color:#fff;font:800 italic 5.2cqw/1.1 Montserrat,"Segoe UI",sans-serif;text-shadow:0 0 .5cqw #d9b8ff,0 0 1.4cqw #a24dff,0 0 3cqw #2b5bff}

/* поява: падіння зверху з відскоком */
.plate.in{animation:drop 1.8s forwards}
@keyframes drop{
 0%{transform:translateY(-140%);animation-timing-function:cubic-bezier(.55,0,.95,.6)}
 50%{transform:translateY(3%);animation-timing-function:cubic-bezier(.2,.6,.4,1)}
 68%{transform:translateY(-1.4%);animation-timing-function:ease-in-out}
 84%{transform:translateY(.5%);animation-timing-function:ease-in-out}
 100%{transform:translateY(0)}}
/* після удару плашка гойдається на «підвісі», потім ледь погойдується */
.plate.in .sway{animation:impact 1.9s ease-out .85s,idle 5s ease-in-out 2.9s infinite}
@keyframes impact{0%{transform:rotate(0)}15%{transform:rotate(1.6deg)}40%{transform:rotate(-1deg)}65%{transform:rotate(.5deg)}100%{transform:rotate(0)}}
@keyframes idle{0%,100%{transform:rotate(0)}25%{transform:rotate(.5deg)}75%{transform:rotate(-.5deg)}}
.plate.in .bg{animation:flash 1s ease-out .85s,glow 3.2s ease-in-out 1.9s infinite}
@keyframes glow{0%,100%{filter:drop-shadow(0 0 1cqw rgba(138,43,226,.6)) drop-shadow(0 0 2.4cqw rgba(0,85,255,.4)) brightness(1)}50%{filter:drop-shadow(0 0 1.4cqw rgba(138,43,226,.8)) drop-shadow(0 0 3cqw rgba(0,85,255,.55)) brightness(1.12)}}
@keyframes flash{0%,100%{filter:drop-shadow(0 0 1cqw rgba(138,43,226,.6)) drop-shadow(0 0 2.4cqw rgba(0,85,255,.4)) brightness(1)}12%{filter:drop-shadow(0 0 2cqw rgba(210,150,255,1)) drop-shadow(0 0 6cqw rgba(60,120,255,.95)) brightness(1.7) saturate(1.3)}}
/* контент: аватар вискакує, нік проявляється */
.plate.in .av{animation:pop .75s cubic-bezier(.2,1.3,.4,1) 1.05s both}
@keyframes pop{from{opacity:0;transform:scale(.2) rotate(-25deg)}60%{opacity:1;transform:scale(1.1) rotate(3deg)}to{opacity:1;transform:none}}
.plate.in .nick{animation:nickin .7s ease-out 1.25s both}
@keyframes nickin{from{opacity:0;filter:blur(1.2cqw);transform:scale(1.25)}to{opacity:1;filter:none;transform:none}}
/* зникнення: легка «присадка» і ривок угору за край */
.plate.out{animation:lift .8s forwards}
@keyframes lift{
 0%{transform:translateY(0);animation-timing-function:ease-out}
 20%{transform:translateY(4%);animation-timing-function:cubic-bezier(.5,0,1,.6)}
 100%{transform:translateY(-150%)}}
.plate.out .av,.plate.out .nick{animation:fade .3s forwards}
@keyframes fade{to{opacity:0}}

/* режим передпоказу */
body.demo{background:#14121f;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;font-family:Montserrat,"Segoe UI",sans-serif}
body.demo .stage{position:relative;inset:auto;width:min(96vw,calc((100vh - 110px)*16/9));aspect-ratio:16/9;border:1px solid #4a3d8f;border-radius:6px;background:linear-gradient(135deg,#17352c,#26213f 60%,#3a2a22)}
.panel{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;align-items:center;color:#cfc6ff;font-size:14px}
.panel input,.panel button{font:inherit;padding:8px 12px;border-radius:8px;border:1px solid #5b4bb3;background:#1f1a38;color:#fff}
.panel button{cursor:pointer;background:#5b3df0;border-color:#7a62ff}
</style>
</head>
<body>
<div class="stage">
  <div class="plate"><div class="sway"><div class="art">
    <img class="bg" src="shoutout.png" alt="">
    <div class="back"></div>
    <div class="av"><b></b><img alt=""></div>
    <div class="nickbox"><span class="nick"></span></div>
  </div></div></div>
</div>
<script>
const DEMO=false;
const $=s=>document.querySelector(s);
const plate=$('.plate'),nick=$('.nick'),box=$('.nickbox'),avi=$('.av img'),ini=$('.av b');
let timer;

function fit(){
  nick.style.fontSize='';
  let fs=parseFloat(getComputedStyle(nick).fontSize);
  const min=fs*.4;
  while(nick.scrollWidth>box.clientWidth&&fs>min){fs*=.94;nick.style.fontSize=fs+'px';}
}

// name — нік, avatar — посилання на аватар, ms — скільки плашка висить на екрані
function showShoutout(name,avatar,ms=15000){
  clearTimeout(timer);
  plate.className='plate';
  void plate.offsetWidth;
  nick.textContent=name;
  ini.textContent=(name||'?').trim().charAt(0).toUpperCase();
  avi.style.display='';
  avi.onerror=()=>{avi.style.display='none'};
  avi.src=avatar||'';
  if(!avatar)avi.style.display='none';
  fit();
  plate.classList.add('in');
  timer=setTimeout(()=>plate.classList.add('out'),ms);
}
window.showShoutout=showShoutout;

const q=new URLSearchParams(location.search);
if(q.get('user'))document.fonts.ready.then(()=>setTimeout(()=>showShoutout(q.get('user'),q.get('avatar'),+q.get('dur')||15000),300));

if(DEMO){
  document.body.classList.add('demo');
  const mk=(c,e)=>'data:image/svg+xml,'+encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="${c[0]}"/><stop offset="1" stop-color="${c[1]}"/></linearGradient></defs><rect width="100" height="100" fill="url(#g)"/><text x="50" y="68" font-size="56" text-anchor="middle">${e}</text></svg>`);
  const avs=[mk(['#ff9a3d','#ff3d81'],'🦊'),mk(['#2bd4a7','#2b5bff'],'🐸'),mk(['#ffd23d','#8a3dff'],'🐱')];
  let n=0;
  const p=document.createElement('div');p.className='panel';
  p.innerHTML='<input id="dn" value="Streamer_Nick" size="16"><button id="b1">▶ Показати</button><button id="b2">Довгий нік</button><button id="b3">Без аватарки</button>';
  document.body.appendChild(p);
  const go=(nm,a)=>showShoutout(nm,a,15000);
  $('#b1').onclick=()=>go($('#dn').value||'Streamer',avs[n++%3]);
  $('#b2').onclick=()=>go('SuperLongNicknameStreamer_2026',avs[n++%3]);
  $('#b3').onclick=()=>go($('#dn').value||'Streamer','');
  document.fonts.ready.then(()=>setTimeout(()=>$('#b1').click(),400));
}
</script>
</body>
</html>
