<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<title>Персональні привітання</title>
<style>
  html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    background: transparent;
    overflow: hidden;
  }
  #stage {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
    transition: opacity 0.4s ease;
  }
  #stage.show { opacity: 1; }
  #stage video, #stage img {
    max-width: 100%;
    max-height: 100%;
    object-fit: contain;
  }
</style>
</head>
<body>
<div id="stage"></div>

<script>
// ===== НАЛАШТУВАННЯ =====
const WS_URL = "ws://127.0.0.1:8080/";   // адреса WebSocket-сервера Streamer.bot
const DEFAULT_IMAGE_SECONDS = 6;          // скільки показувати фото, якщо duration не вказано
const MAX_SECONDS = 30;                   // страховка: більше цього часу ніщо не грає
// ========================

const stage = document.getElementById("stage");
const queue = [];
let busy = false;
let currentAudio = null;

function isVideo(url) {
  return /\.(mp4|webm|mov|m4v)(\?.*)?$/i.test(url);
}

function enqueue(item) {
  queue.push(item);
  next();
}

function next() {
  if (busy || queue.length === 0) return;
  busy = true;
  play(queue.shift());
}

function finish() {
  if (currentAudio) {
    currentAudio.pause();
    currentAudio = null;
  }
  stage.classList.remove("show");
  setTimeout(() => {
    stage.innerHTML = "";
    busy = false;
    next();
  }, 500);
}

function play(item) {
  stage.innerHTML = "";
  let finished = false;
  const end = () => {
    if (finished) return;
    finished = true;
    finish();
  };
  setTimeout(end, MAX_SECONDS * 1000);

  const media = item.media || "";
  const seconds = Number(item.duration) || 0;

  // 1) Відео (звук іде з самого відео)
  if (media && isVideo(media)) {
    const v = document.createElement("video");
    v.src = media;
    v.autoplay = true;
    v.playsInline = true;
    v.onended = end;
    v.onerror = end;
    stage.appendChild(v);
    stage.classList.add("show");
    v.play().catch(end);
    if (seconds) setTimeout(end, seconds * 1000);
    return;
  }

  // 2) Фото / гіф (за бажанням разом з окремим аудіо)
  if (media) {
    const img = document.createElement("img");
    img.src = media;
    img.onerror = end;
    stage.appendChild(img);
    stage.classList.add("show");
  }

  if (item.audio) {
    const a = new Audio(item.audio);
    currentAudio = a;
    a.onerror = end;
    if (!seconds) a.onended = end;
    a.play().catch(end);
  }

  if (seconds || !item.audio) {
    setTimeout(end, (seconds || DEFAULT_IMAGE_SECONDS) * 1000);
  }
}

function connect() {
  const ws = new WebSocket(WS_URL);
  ws.onmessage = (e) => {
    let data;
    try { data = JSON.parse(e.data); } catch (err) { return; }
    if (data && data.source === "personalGreeting") enqueue(data);
  };
  ws.onclose = () => setTimeout(connect, 3000);
  ws.onerror = () => ws.close();
}

connect();
</script>
</body>
</html>
