<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<title>Персональні привітання</title>
<style>
  html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    background: transparent;
    overflow: hidden;
  }
  #stage {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
    transition: opacity 0.4s ease;
  }
  #stage.show { opacity: 1; }
  #stage video, #stage img {
    max-width: 100%;
    max-height: 100%;
    object-fit: contain;
  }
  #debug {
    position: fixed;
    left: 8px;
    top: 8px;
    z-index: 10;
    max-width: 95%;
    padding: 6px 8px;
    background: rgba(0, 0, 0, 0.75);
    color: #fff;
    font: 14px/1.3 monospace;
    white-space: pre-wrap;
  }
</style>
</head>
<body>
<div id="stage"></div>

<script>
// ===== НАЛАШТУВАННЯ =====
const WS_URL = "ws://127.0.0.1:8080/";   // адреса WebSocket-сервера Streamer.bot
const DEFAULT_IMAGE_SECONDS = 6;          // скільки показувати фото, якщо duration не вказано
const MAX_SECONDS = 30;                   // страховка: більше цього часу ніщо не грає
// ========================

// Діагностика: додайте до адреси ?debug=1 і в куті з'явиться панель зі статусом
const DEBUG = new URLSearchParams(location.search).has("debug");

const stage = document.getElementById("stage");
const queue = [];
let busy = false;
let currentAudio = null;

let debugBox = null;
const debugLines = [];
if (DEBUG) {
  debugBox = document.createElement("div");
  debugBox.id = "debug";
  document.body.appendChild(debugBox);
}

function dbg(text) {
  if (!DEBUG) return;
  debugLines.unshift(new Date().toLocaleTimeString() + "  " + text);
  debugLines.length = Math.min(debugLines.length, 8);
  debugBox.textContent = debugLines.join("\n");
}

function isVideo(url) {
  return /\.(mp4|webm|mov|m4v)(\?.*)?$/i.test(url);
}

function enqueue(item) {
  queue.push(item);
  next();
}

function next() {
  if (busy || queue.length === 0) return;
  busy = true;
  play(queue.shift());
}

function finish() {
  if (currentAudio) {
    currentAudio.pause();
    currentAudio = null;
  }
  stage.classList.remove("show");
  setTimeout(() => {
    stage.innerHTML = "";
    busy = false;
    next();
  }, 500);
}

function play(item) {
  stage.innerHTML = "";
  let finished = false;
  const end = () => {
    if (finished) return;
    finished = true;
    finish();
  };
  setTimeout(end, MAX_SECONDS * 1000);

  const media = item.media || "";
  const seconds = Number(item.duration) || 0;

  // 1) Відео (звук іде з самого відео)
  if (media && isVideo(media)) {
    const v = document.createElement("video");
    v.src = media;
    v.autoplay = true;
    v.playsInline = true;
    v.onended = end;
    v.onerror = () => { dbg("ПОМИЛКА відео: файл не знайдено або формат не підтримується"); end(); };
    stage.appendChild(v);
    stage.classList.add("show");
    v.play()
      .then(() => dbg("відео грає"))
      .catch((err) => { dbg("відео: play() відхилено: " + err.name); end(); });
    if (seconds) setTimeout(end, seconds * 1000);
    return;
  }

  // 2) Фото / гіф (за бажанням разом з окремим аудіо)
  if (media) {
    const img = document.createElement("img");
    img.src = media;
    img.onerror = () => { dbg("ПОМИЛКА фото: файл не знайдено"); end(); };
    stage.appendChild(img);
    stage.classList.add("show");
    dbg("фото показано");
  }

  if (item.audio) {
    const a = new Audio(item.audio);
    currentAudio = a;
    a.onerror = () => {
      dbg("ПОМИЛКА аудіо, код " + (a.error ? a.error.code : "?") +
          " (4 = файл не знайдено або формат не підтримується)");
      end();
    };
    if (!seconds) a.onended = end;
    a.play()
      .then(() => dbg("аудіо грає"))
      .catch((err) => { dbg("аудіо: play() відхилено: " + err.name); end(); });
  }

  if (seconds || !item.audio) {
    setTimeout(end, (seconds || DEFAULT_IMAGE_SECONDS) * 1000);
  }
}

function connect() {
  dbg("підключаюсь до " + WS_URL);
  const ws = new WebSocket(WS_URL);
  ws.onopen = () => dbg("WebSocket підключено");
  ws.onmessage = (e) => {
    let data;
    try { data = JSON.parse(e.data); } catch (err) { return; }
    if (data && data.source === "personalGreeting") {
      dbg("отримано привітання для " + data.user);
      enqueue(data);
    }
  };
  ws.onclose = () => {
    dbg("WebSocket не підключений, повтор через 3 с");
    setTimeout(connect, 3000);
  };
  ws.onerror = () => ws.close();
}

connect();
</script>
</body>
</html>
