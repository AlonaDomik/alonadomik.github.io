<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<title>Персональні привітання</title>
<style>
  html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    background: transparent;
    overflow: hidden;
  }
  #stage {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
    transition: opacity 0.4s ease;
  }
  #stage.show { opacity: 1; }
  #stage video, #stage img {
    max-width: 100%;
    max-height: 100%;
    object-fit: contain;
  }
  #debug {
    position: fixed;
    left: 8px;
    top: 8px;
    z-index: 10;
    max-width: 95%;
    padding: 6px 8px;
    background: rgba(0, 0, 0, 0.75);
    color: #fff;
    font: 14px/1.3 monospace;
    white-space: pre-wrap;
  }
</style>
</head>
<body>
<div id="stage"></div>

<script>
// ===== НАЛАШТУВАННЯ =====
const PARAMS = new URLSearchParams(location.search);
// Адреса WebSocket-сервера Streamer.bot. Якщо Streamer.bot на іншому ПК,
// додайте до адреси оверлея ?ws=192.168.0.18:8080 (IP того ПК, де Streamer.bot)
const WS_URL = PARAMS.get("ws") ? "ws://" + PARAMS.get("ws") + "/" : "ws://127.0.0.1:8080/";
const DEFAULT_IMAGE_SECONDS = 6;          // скільки показувати фото, якщо duration не вказано
const MAX_SECONDS = 30;                   // страховка: більше цього часу ніщо не грає
// ========================

// Діагностика: додайте до адреси ?debug=1 і в куті з'явиться панель зі статусом
const DEBUG = PARAMS.has("debug");

const stage = document.getElementById("stage");
const queue = [];
let busy = false;
let currentAudio = null;

let debugBox = null;
const debugLines = [];
if (DEBUG) {
  debugBox = document.createElement("div");
  debugBox.id = "debug";
  document.body.appendChild(debugBox);
}

function dbg(text) {
  if (!DEBUG) return;
  debugLines.unshift(new Date().toLocaleTimeString() + "  " + text);
  debugLines.length = Math.min(debugLines.length, 8);
  debugBox.textContent = debugLines.join("\n");
}

function isVideo(url) {
  return /\.(mp4|webm|mov|m4v)(\?.*)?$/i.test(url);
}

function enqueue(item) {
  queue.push(item);
  next();
}

function next() {
  if (busy || queue.length === 0) return;
  busy = true;
  play(queue.shift());
}

function finish() {
  if (currentAudio) {
    currentAudio.pause();
    currentAudio = null;
  }
  stage.classList.remove("show");
  setTimeout(() => {
    stage.innerHTML = "";
    busy = false;
    next();
  }, 500);
}

function play(item) {
  stage.innerHTML = "";
  let finished = false;
  const end = () => {
    if (finished) return;
    finished = true;
    finish();
  };
  setTimeout(end, MAX_SECONDS * 1000);

  const media = item.media || "";
  const seconds = Number(item.duration) || 0;

  // 1) Відео (звук іде з самого відео)
  if (media && isVideo(media)) {
    const v = document.createElement("video");
    v.src = media;
    v.autoplay = true;
    v.playsInline = true;
    v.onended = end;
    v.onerror = () => { dbg("ПОМИЛКА відео: файл не знайдено або формат не підтримується"); end(); };
    stage.appendChild(v);
    stage.classList.add("show");
    v.play()
      .then(() => dbg("відео грає"))
      .catch((err) => { dbg("відео: play() відхилено: " + err.name); end(); });
    if (seconds) setTimeout(end, seconds * 1000);
    return;
  }

  // 2) Фото / гіф (за бажанням разом з окремим аудіо)
  if (media) {
    const img = document.createElement("img");
    img.src = media;
    img.onerror = () => { dbg("ПОМИЛКА фото: файл не знайдено"); end(); };
    stage.appendChild(img);
    stage.classList.add("show");
    dbg("фото показано");
  }

  if (item.audio) {
    const a = new Audio(item.audio);
    currentAudio = a;
    a.onerror = () => {
      dbg("ПОМИЛКА аудіо, код " + (a.error ? a.error.code : "?") +
          " (4 = файл не знайдено або формат не підтримується)");
      end();
    };
    if (!seconds) a.onended = end;
    a.play()
      .then(() => dbg("аудіо грає"))
      .catch((err) => { dbg("аудіо: play() відхилено: " + err.name); end(); });
  }

  if (seconds || !item.audio) {
    setTimeout(end, (seconds || DEFAULT_IMAGE_SECONDS) * 1000);
  }
}

function connect() {
  dbg("підключаюсь до " + WS_URL);
  const ws = new WebSocket(WS_URL);
  ws.onopen = () => {
    dbg("WebSocket підключено, підписуюсь на General.Custom");
    // Streamer.bot надсилає custom-повідомлення тільки тим, хто на них підписався
    ws.send(JSON.stringify({
      request: "Subscribe",
      id: "personal-greeting",
      events: { General: ["Custom"] }
    }));
  };
  ws.onmessage = (e) => {
    let msg;
    try { msg = JSON.parse(e.data); } catch (err) { return; }
    if (!msg) return;

    // Відповідь на запит підписки
    if (msg.id === "personal-greeting") {
      dbg(msg.status === "ok" ? "підписка на General.Custom: ok" : "підписка НЕ вдалась: " + e.data);
      return;
    }

    // Custom-повідомлення приходить в обгортці: { event: {source, type}, data: {...} }
    let payload = null;
    if (msg.event && msg.event.source === "General" && msg.event.type === "Custom") {
      payload = msg.data;
    } else if (msg.source === "personalGreeting") {
      payload = msg;
    }
    if (typeof payload === "string") {
      try { payload = JSON.parse(payload); } catch (err) { payload = null; }
    }

    if (payload && payload.source === "personalGreeting") {
      dbg("отримано привітання для " + payload.user);
      enqueue(payload);
    }
  };
  ws.onclose = () => {
    dbg("WebSocket не підключений, повтор через 3 с");
    setTimeout(connect, 3000);
  };
  ws.onerror = () => ws.close();
}

// Режим 1 (рекомендований): Streamer.bot через своє підключення до OBS підставляє в URL джерела
//   ?media=...&audio=...&duration=...&t=...  - сторінка відтворює привітання і більше нічого не робить.
// Режим 2: якщо в URL є ?ws=IP:порт - сторінка слухає WebSocket-сервер Streamer.bot.
const directMedia = PARAMS.get("media") || "";
const directAudio = PARAMS.get("audio") || "";

if (directMedia || directAudio) {
  // Захист від повтору: той самий запуск (параметр t) не відтворюється двічі,
  // наприклад після перезапуску OBS чи оновлення сторінки
  const t = PARAMS.get("t");
  let alreadyPlayed = false;
  try {
    if (t) {
      alreadyPlayed = localStorage.getItem("pg_last") === t;
      localStorage.setItem("pg_last", t);
    }
  } catch (err) {}

  if (alreadyPlayed) {
    dbg("це привітання вже відтворено, пропускаю");
  } else {
    dbg("режим URL: " + (PARAMS.get("user") || "гість"));
    enqueue({
      user: PARAMS.get("user") || "",
      media: directMedia,
      audio: directAudio,
      duration: Number(PARAMS.get("duration")) || 0
    });
  }
} else if (PARAMS.has("ws")) {
  connect();
} else {
  dbg("очікую привітання (режим URL)");
}
</script>
</body>
</html>
