<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }
  body {
    width: 1920px;
    height: 1080px;
    overflow: hidden;
    background: #000;
    position: relative;
  }
  /* Фонова заставка з легким ефектом "дихання" камери */
  .bg-container {
    width: 100%;
    height: 100%;
    background: url('bg.jpg') no-repeat center center;
    background-size: cover;
    animation: slowZoom 18s ease-in-out infinite alternate;
  }
  @keyframes slowZoom {
    0% { transform: scale(1); }
    100% { transform: scale(1.025); }
  }

  /* Мерехтіння ліхтаря ліворуч */
  .lantern-glow {
    position: absolute;
    top: 13%;
    left: 7%;
    width: 260px;
    height: 300px;
    background: radial-gradient(circle, rgba(255, 160, 40, 0.45) 0%, rgba(255, 100, 0, 0.15) 45%, transparent 75%);
    mix-blend-mode: screen;
    pointer-events: none;
    animation: flicker 3.5s infinite alternate;
  }
  @keyframes flicker {
    0%, 100% { opacity: 0.75; transform: scale(0.96); }
    25% { opacity: 1; transform: scale(1.06); }
    50% { opacity: 0.65; transform: scale(0.94); }
    75% { opacity: 0.95; transform: scale(1.04); }
  }

  /* Магічна пульсація значка Twitch праворуч */
  .twitch-glow {
    position: absolute;
    top: 40%;
    right: 11%;
    width: 340px;
    height: 340px;
    background: radial-gradient(circle, rgba(169, 112, 255, 0.35) 0%, rgba(255, 200, 80, 0.15) 50%, transparent 75%);
    mix-blend-mode: screen;
    pointer-events: none;
    animation: pulseGlow 4s ease-in-out infinite alternate;
  }
  @keyframes pulseGlow {
    0% { opacity: 0.4; transform: scale(0.9); }
    100% { opacity: 0.95; transform: scale(1.12); }
  }

  /* Підсвітка логотипу та тексту */
  .title-shimmer {
    position: absolute;
    top: 10%;
    right: 4%;
    width: 720px;
    height: 280px;
    background: radial-gradient(ellipse, rgba(255, 215, 100, 0.2) 0%, transparent 70%);
    mix-blend-mode: screen;
    pointer-events: none;
    animation: pulseGlow 5s ease-in-out infinite alternate-reverse;
  }

  /* Легкий нічний туман знизу */
  .mist {
    position: absolute;
    bottom: -40px;
    left: 0;
    width: 200%;
    height: 220px;
    background: linear-gradient(to top, rgba(10, 25, 35, 0.55), transparent);
    filter: blur(20px);
    pointer-events: none;
    animation: drift 20s linear infinite alternate;
  }
  @keyframes drift {
    0% { transform: translateX(0); }
    100% { transform: translateX(-25%); }
  }

  canvas {
    position: absolute;
    top: 0;
    left: 0;
    width: 1920px;
    height: 1080px;
    pointer-events: none;
  }
</style>
</head>
<body>
  <div class="bg-container"></div>
  <div class="lantern-glow"></div>
  <div class="twitch-glow"></div>
  <div class="title-shimmer"></div>
  <div class="mist"></div>
  <canvas id="fireflies"></canvas>

  <script>
    const canvas = document.getElementById('fireflies');
    const ctx = canvas.getContext('2d');
    canvas.width = 1920;
    canvas.height = 1080;

    const particles = Array.from({ length: 65 }, () => ({
      x: Math.random() * canvas.width,
      y: Math.random() * canvas.height,
      r: Math.random() * 3.2 + 1,
      vx: (Math.random() - 0.5) * 0.6,
      vy: -Math.random() * 0.8 - 0.2,
      alpha: Math.random(),
      dAlpha: (Math.random() * 0.015 + 0.005) * (Math.random() < 0.5 ? 1 : -1),
      hue: Math.random() < 0.75 ? 42 : 25 // золоті світлячки та теплі іскри
    }));

    function animate() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      for (const p of particles) {
        p.x += p.vx + Math.sin(p.y * 0.01) * 0.3;
        p.y += p.vy;
        p.alpha += p.dAlpha;

        if (p.alpha <= 0.1 || p.alpha >= 1) p.dAlpha *= -1;
        if (p.y < -10) {
          p.y = canvas.height + 10;
          p.x = Math.random() * canvas.width;
        }
        if (p.x < -10) p.x = canvas.width + 10;
        if (p.x > canvas.width + 10) p.x = -10;

        ctx.save();
        ctx.globalAlpha = Math.max(0, Math.min(1, p.alpha));
        ctx.shadowBlur = 14;
        ctx.shadowColor = `hsl(${p.hue}, 100%, 65%)`;
        ctx.fillStyle = `hsl(${p.hue}, 100%, 75%)`;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }
      requestAnimationFrame(animate);
    }
    animate();
  </script>
</body>
</html>
