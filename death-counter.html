<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Лічильник смертей — ARC Raiders / Fortnite</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Changa+One:ital@0;1&family=Fredoka:wght@600;700&family=Inter:wght@400;500;600;700&family=Press+Start+2P&family=Rubik+Mono+One&family=Share+Tech+Mono&family=VT323&display=swap" rel="stylesheet">

    <style>
        :root {
            --overlay-scale: 1;
        }

        * {
            box-sizing: border-box;
            user-select: none;
        }

        body {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            font-family: 'Inter', sans-serif;
            transition: background-color 0.25s ease;
        }

        body{background:transparent}
        /* Дрібні підписи (раніше були Tailwind-класи) */
        .sys-tag{font:9px/1 ui-monospace,'Share Tech Mono',monospace;letter-spacing:.1em;color:rgba(245,158,11,.8)}
        .rec-tag{font:9px/1 ui-monospace,'Share Tech Mono',monospace;letter-spacing:.05em;color:#94a3b8;margin-left:4px}
        .st-ok{color:#34d399}
        .st-alert{color:#fb7185}

        /* Overlay Container Positioning & Scaling */
        #overlay-stage {
            position: absolute;
            top: 48px;
            left: 48px;
            transform: scale(var(--overlay-scale));
            transform-origin: top left;
            transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
            z-index: 20;
        }

        /* ==========================================================================
           CONCEPT #3: 80s ARC HUD (ARC RAIDERS)
           ========================================================================== */
        .arc-hud-wrapper {
            position: relative;
            width: 440px;
            height: 215px;
            filter: drop-shadow(0 18px 32px rgba(0, 0, 0, 0.65));
            transition: transform 0.3s ease;
        }

        /* Outer Metallic Cassette-Futurism Chassis */
        .arc-chassis {
            position: relative;
            width: 100%;
            height: 100%;
            background: linear-gradient(160deg, #3a4150 0%, #242936 45%, #171a22 100%);
            border-radius: 26px 20px 20px 26px;
            border: 3px solid #101218;
            box-shadow: 
                inset 0 2px 1px rgba(255, 255, 255, 0.2),
                inset 0 -4px 8px rgba(0, 0, 0, 0.7);
            padding: 18px 20px 22px 24px;
            overflow: hidden;
        }

        /* Top Notch Bevel Detail */
        .arc-top-bevel {
            position: absolute;
            top: 0;
            left: 95px;
            right: 45px;
            height: 14px;
            background: #1b1f29;
            border-bottom: 2px solid #0e1015;
            border-left: 2px solid #0e1015;
            border-right: 2px solid #0e1015;
            border-radius: 0 0 8px 8px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 12px;
            z-index: 6;
        }

        /* Hazard Stripes in Top Bevel */
        .arc-hazard-bar {
            width: 56px;
            height: 6px;
            border-radius: 2px;
            background: repeating-linear-gradient(
                -55deg,
                #f59e0b,
                #f59e0b 5px,
                #18181b 5px,
                #18181b 10px
            );
            opacity: 0.9;
        }

        .arc-warning-icons {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        /* Iconic Rainbow Arch SVG Overlay */
        .arc-rainbow-svg {
            position: absolute;
            top: -2px;
            left: -2px;
            width: 180px;
            height: 220px;
            z-index: 8;
            pointer-events: none;
            filter: drop-shadow(2px 0 10px rgba(0, 229, 255, 0.35));
            transition: filter 0.25s ease;
        }

        /* Recessed CRT Screen */
        .arc-crt-bezel {
            position: relative;
            width: 100%;
            height: 100%;
            background: #0b0e14;
            border-radius: 16px;
            border: 4px solid #141821;
            box-shadow: 
                inset 0 8px 20px rgba(0, 0, 0, 0.95),
                0 1px 0 rgba(255, 255, 255, 0.12);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding-left: 68px; /* Space for the rainbow arch on the left */
            padding-right: 12px;
        }

        /* CRT Screen Glass & Scanlines */
        .arc-crt-screen {
            position: absolute;
            inset: 0;
            background: 
                radial-gradient(circle at 60% 50%, rgba(16, 46, 60, 0.55) 0%, rgba(7, 11, 16, 0.96) 85%);
            z-index: 1;
        }

        /* LED Dot Matrix Background Texture */
        .arc-crt-grid {
            position: absolute;
            inset: 0;
            background-image: 
                radial-gradient(rgba(0, 229, 255, 0.08) 1px, transparent 1px),
                repeating-linear-gradient(
                    0deg,
                    rgba(0, 0, 0, 0.28) 0px,
                    rgba(0, 0, 0, 0.28) 1px,
                    transparent 1px,
                    transparent 3px
                );
            background-size: 4px 4px, 100% 3px;
            z-index: 2;
            pointer-events: none;
        }

        /* Screen Gloss Reflection */
        .arc-crt-gloss {
            position: absolute;
            top: -40%;
            left: -10%;
            width: 130%;
            height: 75%;
            background: linear-gradient(180deg, rgba(255,255,255,0.05) 0%, rgba(255,255,255,0) 100%);
            transform: rotate(-8deg);
            pointer-events: none;
            z-index: 3;
        }

        /* ARC Display Typography */
        .arc-display-content {
            position: relative;
            z-index: 4;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            text-align: center;
        }

        .arc-header-meta {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
            padding: 0 10px;
            margin-bottom: 4px;
            font-family: 'Share Tech Mono', monospace;
            font-size: 10px;
            letter-spacing: 2px;
            color: rgba(0, 229, 255, 0.5);
            text-transform: uppercase;
        }

        .arc-main-readout {
            display: flex;
            align-items: baseline;
            justify-content: center;
            gap: 14px;
            width: 100%;
        }

        .arc-label-text {
            font-family: 'Press Start 2P', monospace;
            font-size: 21px;
            color: #e0f7fa;
            letter-spacing: 2px;
            text-shadow: 
                0 0 8px rgba(0, 229, 255, 0.75),
                0 0 18px rgba(0, 229, 255, 0.35);
        }

        .arc-count-text {
            font-family: 'Press Start 2P', monospace;
            font-size: 38px;
            color: #00e5ff;
            letter-spacing: 2px;
            line-height: 1;
            text-shadow: 
                0 0 10px rgba(0, 229, 255, 0.9),
                0 0 24px rgba(0, 229, 255, 0.5),
                2px 2px 0px #004d61;
            position: relative;
        }

        /* Bottom Chassis Bar (LEDs + Cooling Vents) */
        .arc-bottom-bar {
            position: absolute;
            bottom: 4px;
            left: 115px;
            right: 22px;
            height: 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            z-index: 9;
        }

        .arc-leds {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .arc-led-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            border: 1.5px solid #0d1017;
        }
        .arc-led-green {
            background: #00e676;
            box-shadow: 0 0 6px #00e676;
        }
        .arc-led-amber {
            background: #ff9100;
            box-shadow: 0 0 6px #ff9100;
        }
        .arc-led-red {
            background: #451a1a;
            transition: all 0.15s ease;
        }
        .arc-led-red.active-alert {
            background: #ff1744;
            box-shadow: 0 0 10px #ff1744, 0 0 18px #ff1744;
        }

        .arc-vents {
            display: flex;
            gap: 4px;
            background: #171a22;
            padding: 3px 8px;
            border-radius: 4px;
            border: 1px solid #0d1017;
            box-shadow: inset 0 1px 2px rgba(0,0,0,0.8);
        }
        .arc-vent-slot {
            width: 4px;
            height: 8px;
            background: #090b0e;
            border-radius: 1px;
        }

        /* Corner Industrial Bolts */
        .arc-bolt {
            position: absolute;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #1a1e29;
            border: 1.5px solid #0e1017;
            box-shadow: inset 0 1px 1px rgba(255,255,255,0.15);
            z-index: 9;
        }
        .arc-bolt.tr { top: 8px; right: 10px; }
        .arc-bolt.br { bottom: 8px; right: 10px; }

        /* ARC Glitch & Pulse Animation on Death */
        @keyframes arcGlitchAnim {
            0% { transform: translate(0); }
            15% { transform: translate(-5px, 2px) skewX(-3deg); }
            30% { transform: translate(5px, -2px) skewX(3deg); }
            45% { transform: translate(-3px, 0px); }
            60% { transform: translate(3px, 1px); }
            100% { transform: translate(0); }
        }

        @keyframes arcTextFlash {
            0%, 100% { color: #00e5ff; text-shadow: 0 0 10px rgba(0, 229, 255, 0.9), 0 0 24px rgba(0, 229, 255, 0.5); }
            20%, 60% { color: #ff2a2a; text-shadow: 0 0 14px #ff2a2a, 0 0 30px #ff2a2a, -3px 0 #00e5ff, 3px 0 #ffcc00; }
            40% { color: #ffffff; text-shadow: 0 0 20px #ffffff; }
        }

        @keyframes arcArchGlow {
            0%, 100% { filter: drop-shadow(2px 0 10px rgba(0, 229, 255, 0.35)); }
            35% { filter: drop-shadow(4px 0 22px rgba(255, 204, 0, 0.95)) brightness(1.3); }
        }

        .arc-hud-wrapper.trigger-death {
            animation: arcGlitchAnim 0.45s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        }
        .arc-hud-wrapper.trigger-death .arc-count-text {
            animation: arcTextFlash 0.55s ease;
        }
        .arc-hud-wrapper.trigger-death .arc-rainbow-svg {
            animation: arcArchGlow 0.6s ease;
        }


        /* ==========================================================================
           CONCEPT #4: CARTOON BUS HUD (FORTNITE BATTLE BUS)
           ========================================================================== */
        .fn-bus-wrapper {
            position: relative;
            width: 430px;
            height: 245px;
            filter: drop-shadow(0 16px 28px rgba(0, 0, 0, 0.6));
            padding-top: 12px;
        }

        /* Roof Clamps & Hazard Bar */
        .fn-roof-assembly {
            position: relative;
            margin: 0 auto;
            width: 356px;
            height: 26px;
            z-index: 6;
            display: flex;
            align-items: flex-end;
            justify-content: center;
        }

        /* Central Hazard Sign on Roof */
        .fn-hazard-roof {
            width: 240px;
            height: 22px;
            background: repeating-linear-gradient(
                -55deg,
                #facc15,
                #facc15 14px,
                #1e293b 14px,
                #1e293b 28px
            );
            border: 3.5px solid #0f172a;
            border-bottom: none;
            border-radius: 10px 10px 0 0;
            box-shadow: inset 0 3px 0 rgba(255,255,255,0.35);
        }

        /* Roof Emergency Beacon Lights */
        .fn-beacon {
            position: absolute;
            top: 0px;
            width: 26px;
            height: 20px;
            background: linear-gradient(180deg, #60a5fa 0%, #2563eb 100%);
            border: 3px solid #0f172a;
            border-radius: 9px 9px 3px 3px;
            box-shadow: inset 0 3px 2px rgba(255,255,255,0.6);
            transition: all 0.2s ease;
        }
        .fn-beacon.left { left: 14px; }
        .fn-beacon.right { right: 14px; }
        .fn-beacon.flash-active {
            background: linear-gradient(180deg, #fde047 0%, #f97316 100%);
            box-shadow: 0 0 18px #facc15, inset 0 3px 2px #ffffff;
        }

        /* Vertical Metal Straps Connecting Roof to Chassis */
        .fn-vertical-strap {
            position: absolute;
            top: 16px;
            bottom: 24px;
            width: 30px;
            background: linear-gradient(90deg, #64748b 0%, #94a3b8 50%, #475569 100%);
            border: 3.5px solid #0f172a;
            border-radius: 8px;
            z-index: 7;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 8px 0;
            box-shadow: 2px 4px 0 rgba(15, 23, 42, 0.45);
        }
        .fn-vertical-strap.left { left: 62px; }
        .fn-vertical-strap.right { right: 62px; }

        .fn-rivet {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #cbd5e1;
            border: 2px solid #0f172a;
            box-shadow: inset 0 1px 0 #fff;
        }

        /* Main Battle Bus Blue Armored Body */
        .fn-bus-body {
            position: relative;
            width: 396px;
            height: 168px;
            margin: 0 auto;
            background: linear-gradient(180deg, #3b82f6 0%, #2563eb 62%, #1d4ed8 100%);
            border: 4px solid #0f172a;
            border-radius: 22px 22px 16px 16px;
            box-shadow: 
                inset 0 6px 0 rgba(147, 197, 253, 0.5),
                inset 0 -8px 0 #1e3a8a;
            z-index: 5;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: visible;
        }

        /* Side Armored Panel Lines & Rivets */
        .fn-side-panel {
            position: absolute;
            top: 12px;
            bottom: 16px;
            width: 44px;
            background: rgba(30, 58, 138, 0.28);
            border: 2.5px solid #0f172a;
            border-radius: 10px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 8px 0;
        }
        .fn-side-panel.left { left: 10px; }
        .fn-side-panel.right { right: 10px; }

        /* Side Taillights / Blinkers */
        .fn-side-light {
            position: absolute;
            bottom: 42px;
            width: 14px;
            height: 28px;
            background: linear-gradient(180deg, #fb923c 0%, #ef4444 100%);
            border: 3px solid #0f172a;
            z-index: 4;
        }
        .fn-side-light.left {
            left: -10px;
            border-radius: 8px 0 0 8px;
        }
        .fn-side-light.right {
            right: -10px;
            border-radius: 0 8px 8px 0;
        }

        /* Center Digital Screen Frame */
        .fn-screen-frame {
            position: relative;
            width: 214px;
            height: 118px;
            background: #475569;
            border: 4px solid #0f172a;
            border-radius: 16px;
            padding: 6px;
            z-index: 9;
            box-shadow: 
                0 6px 0 rgba(15, 23, 42, 0.4),
                inset 0 2px 0 rgba(255, 255, 255, 0.35);
            margin-bottom: 6px;
        }

        .fn-screen-inner {
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 50% 35%, #1e3a8a 0%, #0f172a 90%);
            border: 3px solid #090d16;
            border-radius: 10px;
            box-shadow: inset 0 4px 12px rgba(0, 0, 0, 0.85);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }

        /* Screen Gloss */
        .fn-screen-inner::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -20%;
            width: 140%;
            height: 80%;
            background: linear-gradient(180deg, rgba(255,255,255,0.12) 0%, rgba(255,255,255,0) 100%);
            transform: rotate(-10deg);
            pointer-events: none;
        }

        .fn-label-text {
            font-family: 'Fredoka', sans-serif;
            font-weight: 700;
            font-size: 16px;
            letter-spacing: 2px;
            color: #60a5fa;
            text-transform: uppercase;
            text-shadow: 0 2px 0 #090d16, 0 0 8px rgba(96, 165, 250, 0.5);
            margin-bottom: -4px;
            z-index: 2;
        }

        .fn-count-text {
            font-family: 'Changa One', cursive;
            font-size: 62px;
            line-height: 1;
            color: #38bdf8;
            text-shadow: 
                0 4px 0 #0284c7,
                0 7px 0 #090d16,
                0 0 18px rgba(56, 189, 248, 0.75);
            z-index: 2;
            transition: transform 0.2s;
        }

        /* Heavy-Duty Angled Suspension Struts */
        .fn-strut {
            position: absolute;
            bottom: 8px;
            width: 34px;
            height: 76px;
            background: linear-gradient(90deg, #94a3b8 0%, #cbd5e1 50%, #64748b 100%);
            border: 3.5px solid #0f172a;
            border-radius: 16px;
            z-index: 11;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 7px 0;
            box-shadow: 0 4px 0 rgba(15, 23, 42, 0.45);
        }
        .fn-strut.left {
            left: 68px;
            transform: rotate(-18deg);
        }
        .fn-strut.right {
            right: 68px;
            transform: rotate(18deg);
        }

        .fn-strut-bolt {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #475569;
            border: 2.5px solid #0f172a;
        }

        /* Lower Bumper Bar */
        .fn-bumper {
            position: absolute;
            bottom: 18px;
            left: 12px;
            right: 12px;
            height: 22px;
            background: linear-gradient(180deg, #475569 0%, #334155 100%);
            border: 3.5px solid #0f172a;
            border-radius: 8px;
            z-index: 8;
            box-shadow: inset 0 2px 0 rgba(255,255,255,0.25);
        }

        /* Cartoon Tires / Wheels with Yellow Rims */
        .fn-wheel {
            position: absolute;
            bottom: 0px;
            width: 56px;
            height: 56px;
            background: radial-gradient(circle at 35% 35%, #334155 0%, #1e293b 60%, #0f172a 100%);
            border: 4px solid #0f172a;
            border-radius: 50%;
            z-index: 10;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 6px 0 rgba(0,0,0,0.45);
        }
        .fn-wheel.left { left: 66px; }
        .fn-wheel.right { right: 66px; }

        .fn-wheel-rim {
            width: 26px;
            height: 26px;
            border-radius: 50%;
            background: radial-gradient(circle, #fde047 0%, #eab308 100%);
            border: 3px solid #0f172a;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .fn-wheel-hub {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #0f172a;
        }

        /* Cute Battle Bus Mini-Balloon Stickers */
        .fn-balloon-decal {
            position: absolute;
            bottom: 36px;
            left: 112px;
            z-index: 6;
            opacity: 0.85;
            transform: rotate(-12deg);
        }

        /* Battle Bus Bounce Animation on Death */
        @keyframes fnBusBounce {
            0% { transform: translateY(0) scale(1, 1) rotate(0deg); }
            20% { transform: translateY(-16px) scale(0.96, 1.05) rotate(-2deg); }
            40% { transform: translateY(6px) scale(1.05, 0.94) rotate(2deg); }
            60% { transform: translateY(-6px) scale(0.99, 1.02) rotate(-1deg); }
            80% { transform: translateY(2px) scale(1.01, 0.99) rotate(0deg); }
            100% { transform: translateY(0) scale(1, 1) rotate(0deg); }
        }

        @keyframes fnNumberPop {
            0% { transform: scale(1); color: #38bdf8; }
            30% { transform: scale(1.38) rotate(-4deg); color: #fde047; text-shadow: 0 4px 0 #ca8a04, 0 8px 0 #090d16, 0 0 25px #fde047; }
            60% { transform: scale(0.9) rotate(2deg); }
            100% { transform: scale(1) rotate(0deg); color: #38bdf8; }
        }

        .fn-bus-wrapper.trigger-death {
            animation: fnBusBounce 0.65s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        .fn-bus-wrapper.trigger-death .fn-count-text {
            animation: fnNumberPop 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        /* Floating +1 Alert Badge */
        .floating-plus-one {
            position: absolute;
            top: -18px;
            right: 28px;
            font-family: 'Press Start 2P', cursive;
            font-size: 22px;
            color: #ff2a2a;
            text-shadow: 0 3px 0 #000, 0 0 12px rgba(255, 42, 42, 0.8);
            pointer-events: none;
            opacity: 0;
            z-index: 30;
        }
        .floating-plus-one.fn-style {
            font-family: 'Changa One', cursive;
            font-size: 34px;
            color: #fde047;
            -webkit-text-stroke: 2px #0f172a;
            text-shadow: 0 4px 0 #0f172a, 0 0 16px rgba(250, 204, 21, 0.9);
        }

        @keyframes floatUpFade {
            0% { opacity: 0; transform: translateY(15px) scale(0.6); }
            25% { opacity: 1; transform: translateY(-6px) scale(1.15); }
            75% { opacity: 1; transform: translateY(-20px) scale(1); }
            100% { opacity: 0; transform: translateY(-34px) scale(0.85); }
        }
        .floating-plus-one.active {
            animation: floatUpFade 0.85s cubic-bezier(0.22, 1, 0.36, 1) forwards;
        }

        /* Hidden Helper */
        .hidden-widget {
            display: none !important;
        }
    </style>
</head>
<body>

    <!-- ==========================================================================
         OVERLAY STAGE (CAPTURE THIS AREA IN OBS)
         ========================================================================== -->
    <div id="overlay-stage">
        
        <!-- Floating +1 Badge -->
        <div id="plus-one-badge" class="floating-plus-one">+1</div>

        <!-- WIDGET 1: 80s ARC HUD (CONCEPT #3) -->
        <div id="widget-arc" class="arc-hud-wrapper">
            <!-- Signature Rainbow Arch SVG on Left Edge -->
            <svg class="arc-rainbow-svg" viewBox="0 0 180 220" fill="none" xmlns="http://www.w3.org/2000/svg">
                <defs>
                    <clipPath id="archClip">
                        <rect x="2" y="2" width="176" height="211" rx="24" />
                    </clipPath>
                    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
                        <feGaussianBlur stdDeviation="2.5" result="blur" />
                        <feMerge>
                            <feMergeNode in="blur" />
                            <feMergeNode in="SourceGraphic" />
                        </feMerge>
                    </filter>
                </defs>
                <g clip-path="url(#archClip)" filter="url(#neonGlow)">
                    <!-- Dark backing for the rainbow arch -->
                    <path d="M 96 -15 C -18 35, 12 135, 108 235" stroke="#0c0f16" stroke-width="54" stroke-linecap="butt" />
                    <!-- 4 Iconic Rainbow Stripes: Cyan, Green, Yellow, Red -->

    <!-- ==========================================================================
         APPLICATION LOGIC & WEB AUDIO SYNTHESIZER
         ========================================================================== -->
    <script>
        // Дані приходять у хеші адреси від Streamer.bot: #d=base64url({"g":"arc|fn","n":число,"a":1 якщо грати анімацію +1})
        // Додатково в адресі: ?scale=1 &x=48 &y=48 &label=DEATHS &sound=0 &demo=1 (перегляд у браузері: + / - / T)
        const P = new URLSearchParams(location.search);
        const normTheme = t => (/^(fn|fortnite)$/i.test(t || '') ? 'fn' : 'arc');
        const state = {
            count: 0,
            theme: normTheme(P.get('theme')),
            label: (P.get('label') || 'DEATHS').toUpperCase(),
            soundEnabled: P.get('sound') !== '0'
        };

        const overlayStage = document.getElementById('overlay-stage');
        const widgetArc = document.getElementById('widget-arc');
        const widgetFn = document.getElementById('widget-fn');
        const arcCountEl = document.getElementById('arc-count');
        const arcLabelEl = document.getElementById('arc-label');
        const arcDangerLed = document.getElementById('arc-danger-led');
        const arcStatusText = document.getElementById('arc-status-text');
        const fnCountEl = document.getElementById('fn-count');
        const fnLabelEl = document.getElementById('fn-label');
        const fnBeaconL = document.getElementById('fn-beacon-l');
        const fnBeaconR = document.getElementById('fn-beacon-r');
        const plusOneBadge = document.getElementById('plus-one-badge');

        // Позиція і розмір
        overlayStage.style.left = (P.get('x') || 48) + 'px';
        overlayStage.style.top = (P.get('y') || 48) + 'px';
        document.documentElement.style.setProperty('--overlay-scale', P.get('scale') || 1);

        // --- Web Audio API Sound Effects (Self-Contained) ---
        let audioCtx = null;
        function playOverlaySound(type) {
            if (!state.soundEnabled) return;
            try {
                if (!audioCtx) {
                    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                }
                if (audioCtx.state === 'suspended') {
                    audioCtx.resume();
                }

                const now = audioCtx.currentTime;

                if (type === 'arc') {
                    // 80s Sci-Fi Computer Glitch + Alert Beep
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(520, now);
                    osc.frequency.setValueAtTime(880, now + 0.06);
                    osc.frequency.setValueAtTime(340, now + 0.12);
                    osc.frequency.setValueAtTime(680, now + 0.18);

                    gain.gain.setValueAtTime(0.12, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.32);

                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.start(now);
                    osc.stop(now + 0.32);
                } else if (type === 'fn') {
                    // Battle Bus Cartoon Horn + Spring Boing
                    const osc1 = audioCtx.createOscillator();
                    const osc2 = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();

                    osc1.type = 'triangle';
                    osc2.type = 'square';

                    // Bouncy pitch slide
                    osc1.frequency.setValueAtTime(240, now);
                    osc1.frequency.exponentialRampToValueAtTime(580, now + 0.18);
                    osc1.frequency.exponentialRampToValueAtTime(390, now + 0.35);

                    osc2.frequency.setValueAtTime(360, now);
                    osc2.frequency.exponentialRampToValueAtTime(720, now + 0.18);

                    gain.gain.setValueAtTime(0.12, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.38);

                    osc1.connect(gain);
                    osc2.connect(gain);
                    gain.connect(audioCtx.destination);

                    osc1.start(now);
                    osc2.start(now);
                    osc1.stop(now + 0.38);
                    osc2.stop(now + 0.38);
                }
            } catch (err) {
                // Ignore audio errors if user hasn't interacted yet
            }
        }

        function formatCount(val) {
            return String(val).padStart(2, '0');
        }

        function renderState() {
            const formatted = formatCount(state.count);
            arcCountEl.textContent = formatted;
            fnCountEl.textContent = formatted;
            arcLabelEl.textContent = state.label;
            fnLabelEl.textContent = state.label;
            const isArc = state.theme === 'arc';
            widgetArc.classList.toggle('hidden-widget', !isArc);
            widgetFn.classList.toggle('hidden-widget', isArc);
            plusOneBadge.classList.toggle('fn-style', !isArc);
        }

        let animTimer = null;
        function triggerDeathAnimation() {
            const activeWidget = state.theme === 'arc' ? widgetArc : widgetFn;
            activeWidget.classList.remove('trigger-death');
            plusOneBadge.classList.remove('active');
            void activeWidget.offsetWidth;
            activeWidget.classList.add('trigger-death');
            plusOneBadge.textContent = '+1';
            plusOneBadge.classList.add('active');
            playOverlaySound(state.theme);

            if (state.theme === 'arc') {
                arcDangerLed.classList.add('active-alert');
                arcStatusText.textContent = 'ALERT';
                arcStatusText.className = 'st-alert';
            } else {
                fnBeaconL.classList.add('flash-active');
                fnBeaconR.classList.add('flash-active');
            }

            clearTimeout(animTimer);
            animTimer = setTimeout(() => {
                activeWidget.classList.remove('trigger-death');
                arcDangerLed.classList.remove('active-alert');
                arcStatusText.textContent = 'ONLINE';
                arcStatusText.className = 'st-ok';
                fnBeaconL.classList.remove('flash-active');
                fnBeaconR.classList.remove('flash-active');
            }, 700);
        }

        function decodeHash() {
            var m = /[#&]d=([^&]+)/.exec(location.hash);
            if (!m) return null;
            try {
                var b = m[1].replace(/-/g, '+').replace(/_/g, '/');
                while (b.length % 4) b += '=';
                return JSON.parse(atob(b));
            } catch (e) { return null; }
        }
        function applyHash() {
            var d = decodeHash();
            if (!d) return;
            if (d.g) state.theme = normTheme(d.g);
            var n = parseInt(d.n, 10);
            state.count = isNaN(n) ? 0 : Math.max(0, n);
            renderState();
            if (d.a) triggerDeathAnimation();
        }
        window.addEventListener('hashchange', applyHash);

        // Перегляд у звичайному браузері: додай ?demo=1 до адреси
        if (P.get('demo')) {
            document.addEventListener('keydown', (e) => {
                if (e.key === '+' || e.key === '=') { state.count++; renderState(); triggerDeathAnimation(); }
                if (e.key === '-') { state.count = Math.max(0, state.count - 1); renderState(); }
                if (e.key === 't' || e.key === 'T') { state.theme = state.theme === 'arc' ? 'fn' : 'arc'; renderState(); }
            });
        }

        renderState();
        applyHash();
    </script>
